id = "maro114510.toggle-popup"
name = "Toggle Popup"
version = "1.0.0"
min_herdr_version = "0.9.3"
platforms = ["macos", "linux"]

[[build]]
command = ["sh", "scripts/build.sh"]

[[actions]]
id = "toggle-shell"
title = "Toggle popup shell"
contexts = ["workspace", "tab", "pane"]
command = ["./bin/toggle-popup", "toggle", "shell"]

[[panes]]
id = "shell"
title = "Popup Shell"
placement = "popup"
width = "100%"
height = "100%"
command = ["./bin/toggle-popup", "popup-shell", "shell"]
