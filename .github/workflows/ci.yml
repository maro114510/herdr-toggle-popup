name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run ShellCheck
        uses: reviewdog/action-shellcheck@d0b8d5fd7fad6afdb6e1b6ce1778892be4d1f427 # v1.34.1
        with:
          reporter: github-check
          fail_level: any

  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      pull-requests: write
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "$fmt_out"
            exit 1
          fi
      - name: Check module integrity
        run: |
          # Download first: go mod verify only checks modules already in the cache,
          # so on a cold runner it would otherwise verify nothing.
          go mod download
          go mod verify
      - name: Check go mod tidy
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "go mod tidy produced changes. Run 'go mod tidy' locally and commit the result."
            exit 1
          fi
      - name: Check go fix
        run: |
          go fix ./...
          if ! git diff --exit-code -- '*.go'; then
            echo "go fix produced Go source changes. Run 'go fix ./...' locally and commit the result."
            exit 1
          fi
      - name: Run go vet
        run: go vet ./...
      - name: Run go test
        run: go test -coverprofile=coverage.out ./...
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck -version
          govulncheck ./...
      - if: matrix.os == 'ubuntu-latest'
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        with:
          version: v0.83.3

  # Real tmux coverage on a pinned version each, not the runner image's. The job name is explicit
  # because an include-only matrix would append the SHA-256 to the required check context.
  tmux-compat:
    name: tmux-compat (${{ matrix.tmux }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # SHA-256 of the release assets at
          # https://github.com/tmux/tmux/releases/download/<version>/tmux-<version>.tar.gz
          - tmux: "2.9"
            sha256: 34901232f486fd99f3a39e864575e658b5d49f43289ccc6ee57c365f2e2c2980
          - tmux: "3.8"
            sha256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install tmux ${{ matrix.tmux }} build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison build-essential libevent-dev libncurses-dev pkg-config
      - name: Build and install tmux ${{ matrix.tmux }}
        env:
          TMUX_VERSION: ${{ matrix.tmux }}
          TMUX_SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/tmux-src"
          prefix="$RUNNER_TEMP/tmux-$TMUX_VERSION"
          tarball="tmux-$TMUX_VERSION.tar.gz"
          mkdir -p "$source_dir"
          cd "$source_dir"
          curl -fsSL --retry 3 -o "$tarball" \
            "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/$tarball"
          printf '%s  %s\n' "$TMUX_SHA256" "$tarball" | sha256sum -c -
          tar xzf "$tarball"
          cd "tmux-$TMUX_VERSION"
          ./configure --prefix="$prefix"
          make -j"$(nproc)"
          make install
          printf '%s/bin\n' "$prefix" >> "$GITHUB_PATH"
      - name: Report the tmux version
        env:
          TMUX_VERSION: ${{ matrix.tmux }}
        run: |
          set -euo pipefail
          tmux_path="$(command -v tmux)"
          tmux_version="$(tmux -V)"
          printf 'tmux binary: %s\ntmux version: %s\n' "$tmux_path" "$tmux_version"
          expected_path="$RUNNER_TEMP/tmux-$TMUX_VERSION/bin/tmux"
          if [ "$tmux_path" != "$expected_path" ]; then
            printf '::error::expected the built binary at %s, found %s\n' "$expected_path" "$tmux_path"
            exit 1
          fi
          if [ "$tmux_version" != "tmux $TMUX_VERSION" ]; then
            printf '::error::expected tmux %s, found %s\n' "$TMUX_VERSION" "$tmux_version"
            exit 1
          fi
      - name: Run the real tmux server tests
        env:
          HERDR_TEST_REQUIRE_TMUX: "1"
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/real-tmux-tests.log"
          go test -count=1 -run TestTmuxAttachScript -v ./internal/popupshell/ | tee "$log"
          # A -run pattern that matches nothing exits 0, so assert the tests both ran and passed.
          if grep -q -- '--- SKIP' "$log"; then
            printf '::error::a real tmux server test was skipped\n'
            exit 1
          fi
          passed="$(grep -c -- '^--- PASS: TestTmuxAttachScript' "$log" || true)"
          if [ "$passed" -lt 10 ]; then
            printf '::error::expected at least 10 real tmux server tests to pass, saw %s\n' "$passed"
            exit 1
          fi
          # The count cannot prove the clipboard tests ran, so require each by name.
          for test in \
            TestTmuxAttachScriptMouseDragCopiesToOuterClipboard \
            TestTmuxAttachScriptMouseDragWithoutMsSkipsOSC52; do
            if ! grep -Fq -- "--- PASS: $test " "$log"; then
              printf '::error::%s did not run and pass\n' "$test"
              exit 1
            fi
          done

  race:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run go test with the race detector
        run: go test -race ./...

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
