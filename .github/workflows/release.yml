name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run go vet
        run: go vet ./...
      - name: Run go test
        run: go test ./...

  github-release:
    name: GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify tag matches manifest version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          VERSION="${TAG_NAME#v}"
          MANIFEST_VERSION="$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' herdr-plugin.toml | head -n 1)"
          test "${MANIFEST_VERSION}" = "${VERSION}" || { echo "herdr-plugin.toml has version ${MANIFEST_VERSION}, expected ${VERSION}"; exit 1; }

      - name: Build cross-compiled binaries
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          VERSION="${TAG_NAME#v}"
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            echo "Building ${goos}/${goarch}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/toggle-popup_${goos}_${goarch}" .
          done

      - name: Smoke test linux/amd64 binary
        run: |
          set -eu
          ./dist/toggle-popup_linux_amd64 version

      # Both tools are fetched by version and verified against their published SHA-256,
      # because an installer script would resolve to whatever it points at that day.
      - name: Install pinned SBOM tools
        env:
          SYFT_VERSION: 1.55.0
          SYFT_SHA256: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
          CYCLONEDX_CLI_VERSION: 0.33.1
          CYCLONEDX_CLI_SHA256: bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746
        run: |
          set -eu
          tools="${RUNNER_TEMP}/sbom-tools"
          mkdir -p "${tools}"
          curl -fsSL --retry 3 -o "${tools}/syft.tar.gz" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "${SYFT_SHA256}" "${tools}/syft.tar.gz" | sha256sum -c -
          tar xzf "${tools}/syft.tar.gz" -C "${tools}" syft
          curl -fsSL --retry 3 -o "${tools}/cyclonedx" \
            "https://github.com/CycloneDX/cyclonedx-cli/releases/download/v${CYCLONEDX_CLI_VERSION}/cyclonedx-linux-x64"
          printf '%s  %s\n' "${CYCLONEDX_CLI_SHA256}" "${tools}/cyclonedx" | sha256sum -c -
          chmod +x "${tools}/cyclonedx"
          printf '%s\n' "${tools}" >> "${GITHUB_PATH}"

      # A failed generation or validation must stop the run before the release is published.
      - name: Generate and validate SBOMs
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: sh scripts/generate-sbom.sh dist "${TAG_NAME#v}"

      - name: Generate checksums
        run: |
          set -eu
          (cd dist && sha256sum toggle-popup_* > checksums.txt)

      # A failed attestation must stop the run before the release is published.
      - name: Generate artifact attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/toggle-popup_*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "${TAG_NAME}" --title "${TAG_NAME}" --generate-notes --verify-tag \
            dist/toggle-popup_darwin_amd64 \
            dist/toggle-popup_darwin_arm64 \
            dist/toggle-popup_linux_amd64 \
            dist/toggle-popup_linux_arm64 \
            dist/sbom_toggle-popup_darwin_amd64.cdx.json \
            dist/sbom_toggle-popup_darwin_arm64.cdx.json \
            dist/sbom_toggle-popup_linux_amd64.cdx.json \
            dist/sbom_toggle-popup_linux_arm64.cdx.json \
            dist/checksums.txt
